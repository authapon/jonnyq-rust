[package]
name = "jonnyq"
version = "0.1.0"
edition = "2021"
description = "Interactive coding agent CLI (Rust + tokio port of the Go jonnyq)"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
html-escape = "0.2"
libc = "0.2"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal", "fs", "io-std"] }
tokio-util = "0.7"

[profile.release]
strip = true
